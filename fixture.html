<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fixture — El Alargue</title>
<meta name="description" content="Fixture del torneo de fútbol 5 El Alargue: horarios, canchas, resultados, posiciones y la llave de Copa de Oro y Copa de Plata.">
<meta name="theme-color" content="#09152b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --navy:#09152b; --bg:#09152b; --bg-2:#0b1a33; --surface:#0f1f3b; --surface-2:#13223f;
  --ink:#f4f7fc; --muted:#9fabc4; --faint:#8491ad;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.26); --white:#fff; --focus:#9fc3ff;
  --win:#5ad17f; --live:#f0b24a;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"Space Mono",ui-monospace,monospace;
  --maxw:1080px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--font-body); color:var(--ink); line-height:1.55; margin:0; -webkit-font-smoothing:antialiased; overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
.wrap{max-width:var(--maxw); margin-inline:auto; padding-inline:max(18px,env(safe-area-inset-left,0px))}
.mono{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em}

/* header */
header{position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line)}
.bar{display:flex; align-items:center; gap:14px; height:60px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none}
.brand img{height:30px; width:auto; display:block}
.brand .wm{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.07em; font-size:1.18rem}
.bar .spacer{flex:1}
.nav{display:flex; gap:4px}
.nav a{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  font-size:.92rem; text-decoration:none; color:var(--muted); padding:.5em .8em; border-radius:0}
.nav a.on{color:var(--ink); box-shadow:inset 0 -2px 0 var(--white)}
.nav a:hover{color:var(--ink)}

/* title band */
.hero{border-bottom:1px solid var(--line); background:var(--bg-2)}
.hero .wrap{padding-block:26px 24px}
.hero .eyebrow{font-family:var(--font-mono); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
.hero h1{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:clamp(2.2rem,7vw,3.4rem); line-height:.95; margin:8px 0 0}
.note{display:flex; gap:10px; align-items:flex-start; margin-top:16px; border:1px solid var(--line); padding:12px 14px; background:var(--surface); max-width:70ch}
.note svg{flex:0 0 auto; width:18px; height:18px; color:var(--live); margin-top:2px}
.note p{margin:0; color:var(--muted); font-size:.92rem}

/* controls */
.controls{display:flex; flex-wrap:wrap; gap:14px; align-items:center; padding-block:22px 6px}
.seg{display:inline-flex; border:1px solid var(--line-2); background:var(--bg-2)}
.seg button{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  font-size:.92rem; color:var(--muted); background:transparent; border:0; padding:.55em 1.05em; cursor:pointer; transition:.14s}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--white); color:var(--navy)}
.seg button:not(.on):hover{color:var(--ink)}
.seg.small button{font-size:.82rem; padding:.5em .9em}
.controls .sp{flex:1}
.upd{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; color:var(--faint); text-transform:uppercase}

main{padding-bottom:60px}
.section-h{font-family:var(--font-mono); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
  color:var(--faint); margin:26px 0 10px; display:flex; align-items:center; gap:10px}
.section-h::after{content:""; flex:1; height:1px; background:var(--line)}

/* match list */
.matches{display:grid; gap:0; border:1px solid var(--line)}
.match{display:grid; grid-template-columns:72px 1fr auto 1fr; align-items:center; gap:12px; padding:13px 14px; transition:background .15s}
.match + .match{border-top:1px solid var(--line)}
.match:hover{background:var(--surface)}
.match .slot{font-family:var(--font-mono); font-size:.74rem; line-height:1.3; color:var(--muted)}
.match .slot .c{display:block; color:var(--faint); font-size:.66rem; letter-spacing:.1em}
.match .t{font-family:var(--font-display); font-weight:600; text-transform:uppercase; letter-spacing:.01em; font-size:1.08rem}
.match .t.home{text-align:right}
.match .t.away{text-align:left}
.match .t.ph{color:var(--muted); font-weight:500}
.match .t .zchip{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.08em; color:var(--faint); text-transform:uppercase}
.result{min-width:74px; text-align:center; font-family:var(--font-display); font-weight:700; font-size:1.3rem;
  font-variant-numeric:tabular-nums; line-height:1; white-space:nowrap}
.result .pen{display:block; font-family:var(--font-mono); font-weight:400; font-size:.6rem; color:var(--faint); letter-spacing:.06em; margin-top:3px}
.result.vs{color:var(--faint); font-family:var(--font-mono); font-size:.8rem; letter-spacing:.1em; font-weight:400}
.result .w{color:var(--win)}
.badge-live{display:inline-block; font-family:var(--font-mono); font-size:.58rem; letter-spacing:.1em; text-transform:uppercase;
  color:var(--navy); background:var(--live); padding:2px 6px; margin-top:4px}
.libre{padding:11px 14px; border-top:1px solid var(--line); font-family:var(--font-mono); font-size:.72rem;
  letter-spacing:.06em; color:var(--faint); text-transform:uppercase}

@media(max-width:560px){
  .match{grid-template-columns:58px 1fr auto 1fr; gap:8px; padding:11px 10px}
  .match .t{font-size:.9rem}
  .result{font-size:1.1rem; min-width:58px}
  .match .slot{font-size:.66rem}
}

/* standings */
.zonas-grid{display:grid; gap:18px; grid-template-columns:1fr}
@media(min-width:720px){ .zonas-grid{grid-template-columns:1fr 1fr} }
.ztable{border:1px solid var(--line)}
.ztable .zh{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.2rem;
  padding:12px 14px; border-bottom:1px solid var(--line); background:var(--bg-2); display:flex; justify-content:space-between; align-items:center}
.ztable .zh .zt{font-family:var(--font-mono); font-size:.62rem; letter-spacing:.14em; color:var(--faint)}
table{width:100%; border-collapse:collapse; font-size:.9rem}
th,td{padding:9px 6px; text-align:center; font-variant-numeric:tabular-nums}
th{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); font-weight:400; border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
.team-cell{text-align:left; font-family:var(--font-display); font-weight:600; text-transform:uppercase; font-size:1rem; white-space:nowrap}
.pos{color:var(--faint); font-family:var(--font-mono); font-size:.72rem; width:22px}
tr.q1 .pos, tr.q2 .pos{color:var(--win)}
td.pts{font-family:var(--font-display); font-weight:700; font-size:1.05rem}
.legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; font-family:var(--font-mono); font-size:.66rem; letter-spacing:.06em; color:var(--faint); text-transform:uppercase}
.legend .dot{display:inline-block; width:8px; height:8px; background:var(--win); margin-right:6px; vertical-align:middle}

/* bracket */
.cups{display:grid; gap:26px; grid-template-columns:1fr}
@media(min-width:860px){ .cups{grid-template-columns:1fr 1fr} }
.cup{border:1px solid var(--line)}
.cup .ch{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.5rem; letter-spacing:.02em;
  padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; background:var(--bg-2)}
.cup .ch .m{width:14px; height:14px; border-radius:50%}
.cup.oro .ch .m{background:var(--white); box-shadow:0 0 0 4px rgba(255,255,255,.12)}
.cup.plata .ch .m{background:var(--faint)}
.round{padding:14px 16px}
.round + .round{border-top:1px solid var(--line)}
.round .rl{font-family:var(--font-mono); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:10px}
.tie{display:grid; grid-template-columns:72px 1fr; gap:10px; padding:9px 0; align-items:center}
.tie + .tie{border-top:1px dashed var(--line)}
.tie .slot{font-family:var(--font-mono); font-size:.68rem; color:var(--muted); line-height:1.3}
.tie .slot .c{display:block; color:var(--faint); font-size:.6rem}
.tie .pair{display:flex; flex-direction:column; gap:3px}
.tie .pair span{font-family:var(--font-display); font-weight:600; text-transform:uppercase; color:var(--muted); font-size:1rem}

footer{border-top:1px solid var(--line); background:var(--bg-2)}
footer .wrap{padding-block:26px; display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px}
footer img{height:26px}
footer .sp{flex:1}
footer .muted{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.1em; color:var(--faint); text-transform:uppercase}
footer a.back{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em; text-decoration:none; color:var(--ink); font-size:.95rem}
[hidden]{display:none!important}
</style>
</head>

a": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "oC21740", "dia": "s2", "fase": "oro", "ronda": "Cuartos", "zona": null, "hora": "17:40", "cancha": 2, "a": "1º Zona D", "b": "2º Zona C", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "pC31700", "dia": "s2", "fase": "plata", "ronda": "Cuartos", "zona": null, "hora": "17:00", "cancha": 3, "a": "3º Zona A", "b": "4º Zona B", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "pC31740", "dia": "s2", "fase": "plata", "ronda": "Cuartos", "zona": null, "hora": "17:40", "cancha": 3, "a": "3º Zona C", "b": "4º Zona D", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "pC11820", "dia": "s2", "fase": "plata", "ronda": "Cuartos", "zona": null, "hora": "18:20", "cancha": 1, "a": "3º Zona B", "b": "4º Zona A", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "pC21820", "dia": "s2", "fase": "plata", "ronda": "Cuartos", "zona": null, "hora": "18:20", "cancha": 2, "a": "3º Zona D", "b": "4º Zona C", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "oS11900", "dia": "s2", "fase": "oro", "ronda": "Semis", "zona": null, "hora": "19:00", "cancha": 1, "a": "Gan. Cuartos 1", "b": "Gan. Cuartos 2", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "oS21900", "dia": "s2", "fase": "oro", "ronda": "Semis", "zona": null, "hora": "19:00", "cancha": 2, "a": "Gan. Cuartos 3", "b": "Gan. Cuartos 4", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "pS11940", "dia": "s2", "fase": "plata", "ronda": "Semis", "zona": null, "hora": "19:40", "cancha": 1, "a": "Gan. Cuartos 1", "b": "Gan. Cuartos 2", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "pS21940", "dia": "s2", "fase": "plata", "ronda": "Semis", "zona": null, "hora": "19:40", "cancha": 2, "a": "Gan. Cuartos 3", "b": "Gan. Cuartos 4", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "pF12040", "dia": "s2", "fase": "plata", "ronda": "Final", "zona": null, "hora": "20:40", "cancha": 1, "a": "Finalista 1", "b": "Finalista 2", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}, {"id": "oF12120", "dia": "s2", "fase": "oro", "ronda": "Final", "zona": null, "hora": "21:20", "cancha": 1, "a": "Finalista 1", "b": "Finalista 2", "ga": null, "gb": null, "pa": null, "pb": null, "estado": "programado"}], "nombres": {}};
(function(){
  "use strict";
  var F = FIXTURE;
  var NAMES = F.nombres || {};
  function name(id){ return NAMES[id] || id; }
  function isPlaceholder(id){ return !NAMES[id]; }

  var state = { tab:"partidos", day:(F.dias[0]&&F.dias[0].id)||"s1", view:"horario" };

  document.getElementById('nota').textContent = F.nota || "";
  document.getElementById('upd').textContent = F.actualizado ? ("Actualizado " + F.actualizado) : "";

  // day selector
  var daysEl = document.getElementById('days');
  F.dias.forEach(function(d,i){
    var b=document.createElement('button'); b.dataset.day=d.id;
    b.innerHTML = d.label + ' <span class="mono" style="font-size:.7em;opacity:.7">'+d.fecha+'</span>';
    if(i===0) b.className='on';
    b.addEventListener('click', function(){ state.day=d.id; syncControls(); render(); });
    daysEl.appendChild(b);
  });

  document.querySelectorAll('#tabs button').forEach(function(b){
    b.addEventListener('click', function(){ state.tab=b.dataset.tab; syncControls(); render(); });
  });
  document.querySelectorAll('#view button').forEach(function(b){
    b.addEventListener('click', function(){ state.view=b.dataset.view; syncControls(); render(); });
  });

  function syncControls(){
    document.querySelectorAll('#tabs button').forEach(function(b){ b.classList.toggle('on', b.dataset.tab===state.tab); });
    document.querySelectorAll('#days button').forEach(function(b){ b.classList.toggle('on', b.dataset.day===state.day); });
    document.querySelectorAll('#view button').forEach(function(b){ b.classList.toggle('on', b.dataset.view===state.view); });
    document.getElementById('days').hidden = (state.tab!=='partidos');
    document.getElementById('view').hidden = (state.tab!=='partidos');
  }

  function esc(s){ return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  function resultHTML(p){
    if(p.ga!=null && p.gb!=null){
      var aw = p.ga>p.gb, bw = p.gb>p.ga;
      var pen = (p.pa!=null&&p.pb!=null) ? '<span class="pen">('+p.pa+'-'+p.pb+' pen)</span>' : '';
      return '<div class="result"><span class="'+(aw?'w':'')+'">'+p.ga+'</span> - <span class="'+(bw?'w':'')+'">'+p.gb+'</span>'+pen+'</div>';
    }
    if(p.estado==='jugando') return '<div class="result vs">vs<span class="badge-live">En vivo</span></div>';
    return '<div class="result vs">vs</div>';
  }
  function teamHTML(id, side, showZona){
    var ph = isPlaceholder(id) ? ' ph' : '';
    var z = (showZona && /^[A-D][1-4]$/.test(id)) ? '<span class="zchip">Z'+id[0]+'</span> ' : '';
    return '<div class="t '+side+ph+'">'+(side==='home'?esc(name(id))+' '+z : z+esc(name(id)))+'</div>';
  }
  function matchHTML(p, showZona){
    return '<div class="match">'
      + '<div class="slot">'+p.hora+'<span class="c">Cancha '+p.cancha+'</span></div>'
      + teamHTML(p.a,'home',showZona) + resultHTML(p) + teamHTML(p.b,'away',showZona)
      + '</div>';
  }

  function dayPartidos(day){ return F.partidos.filter(function(p){return p.dia===day;}); }

  function renderPartidos(){
    var day = state.day;
    var ps = dayPartidos(day);
    var html = '';
    if(state.view==='horario'){
      var horas = []; ps.forEach(function(p){ if(horas.indexOf(p.hora)<0) horas.push(p.hora); });
      horas.sort();
      horas.forEach(function(h){
        var grp = ps.filter(function(p){return p.hora===h;}).sort(function(a,b){return a.cancha-b.cancha;});
        html += '<div class="section-h">'+h+' hs</div><div class="matches">';
        grp.forEach(function(p){ html += matchHTML(p, true); });
        html += '</div>';
      });
    } else {
      if(day==='s1'){
        Object.keys(F.zonas).forEach(function(z){
          var grp = ps.filter(function(p){return p.zona===z;}).sort(function(a,b){return a.hora<b.hora?-1:1;});
          html += '<div class="section-h">Zona '+z+'</div><div class="matches">';
          grp.forEach(function(p){ html += matchHTML(p, false); });
          // libre (none in 4-team round robin) — skip
          html += '</div>';
        });
      } else {
        [['oro','Copa de Oro'],['plata','Copa de Plata']].forEach(function(f){
          var grp = ps.filter(function(p){return p.fase===f[0];}).sort(function(a,b){return a.hora<b.hora?-1:1;});
          html += '<div class="section-h">'+f[1]+'</div><div class="matches">';
          grp.forEach(function(p){ html += matchHTML(p, false); });
          html += '</div>';
        });
      }
    }
    document.getElementById('pane-partidos').innerHTML = html;
  }

  function computeStandings(){
    var tables = {};
    Object.keys(F.zonas).forEach(function(z){
      tables[z] = {};
      F.zonas[z].forEach(function(t){ tables[z][t]={eq:t,pj:0,g:0,e:0,p:0,gf:0,gc:0}; });
    });
    F.partidos.forEach(function(p){
      if(p.dia!=='s1' || p.fase!=='grupos') return;
      if(p.ga==null || p.gb==null) return;
      var r=tables[p.zona]; if(!r||!r[p.a]||!r[p.b]) return;
      var A=r[p.a], B=r[p.b];
      A.pj++; B.pj++; A.gf+=p.ga; A.gc+=p.gb; B.gf+=p.gb; B.gc+=p.ga;
      if(p.ga>p.gb){A.g++;B.p++;} else if(p.gb>p.ga){B.g++;A.p++;} else {A.e++;B.e++;}
    });
    var out={};
    Object.keys(tables).forEach(function(z){
      var rows=Object.values(tables[z]).map(function(r){ r.dg=r.gf-r.gc; r.pts=r.g*3+r.e; return r; });
      rows.sort(function(a,b){ return b.pts-a.pts || b.dg-a.dg || b.gf-a.gf || (a.eq<b.eq?-1:1); });
      out[z]=rows;
    });
    return out;
  }

  function renderPosiciones(){
    var st = computeStandings();
    var html = '<div class="zonas-grid">';
    Object.keys(st).forEach(function(z){
      html += '<div class="ztable"><div class="zh">Zona '+z+' <span class="zt">Clasifican 2</span></div>'
        + '<table><thead><tr><th></th><th class="team-cell" style="text-align:left">Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>';
      st[z].forEach(function(r,i){
        var cls = i<2 ? ('q'+(i+1)) : '';
        html += '<tr class="'+cls+'"><td class="pos">'+(i+1)+'</td><td class="team-cell">'+esc(name(r.eq))+'</td>'
          + '<td>'+r.pj+'</td><td>'+r.g+'</td><td>'+r.e+'</td><td>'+r.p+'</td><td>'+r.gf+'</td><td>'+r.gc+'</td><td>'+(r.dg>0?'+':'')+r.dg+'</td><td class="pts">'+r.pts+'</td></tr>';
      });
      html += '</tbody></table></div>';
    });
    html += '</div><div class="legend"><span><span class="dot"></span>1º y 2º → Copa de Oro</span><span>3º y 4º → Copa de Plata</span></div>';
    document.getElementById('pane-posiciones').innerHTML = html;
  }

  function renderLlave(){
    var ps = F.partidos.filter(function(p){return p.dia==='s2';});
    var html = '<div class="cups">';
    [['oro','Copa de Oro'],['plata','Copa de Plata']].forEach(function(f){
      html += '<div class="cup '+f[0]+'"><div class="ch"><span class="m"></span>'+f[1]+'</div>';
      [['Cuartos','Cuartos de final'],['Semis','Semifinales'],['Final','Final']].forEach(function(rn){
        var grp = ps.filter(function(p){return p.fase===f[0] && p.ronda===rn[0];}).sort(function(a,b){return a.hora<b.hora?-1:1;});
        if(!grp.length) return;
        html += '<div class="round"><div class="rl">'+rn[1]+'</div>';
        grp.forEach(function(p){
          var res = (p.ga!=null&&p.gb!=null) ? (' <span style="color:var(--white)">'+p.ga+'-'+p.gb+'</span>') : '';
          html += '<div class="tie"><div class="slot">'+p.hora+'<span class="c">Cancha '+p.cancha+'</span></div>'
            + '<div class="pair"><span>'+esc(name(p.a))+res+'</span><span>'+esc(name(p.b))+'</span></div></div>';
        });
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
    document.getElementById('pane-llave').innerHTML = html;
  }

  function render(){
    document.getElementById('pane-partidos').hidden = state.tab!=='partidos';
    document.getElementById('pane-posiciones').hidden = state.tab!=='posiciones';
    document.getElementById('pane-llave').hidden = state.tab!=='llave';
    if(state.tab==='partidos') renderPartidos();
    else if(state.tab==='posiciones') renderPosiciones();
    else renderLlave();
  }

  syncControls(); render();
})();
</script>
