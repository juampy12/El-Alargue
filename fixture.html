<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fixture — El Alargue</title>
<meta name="description" content="Fixture del torneo de fútbol 5 El Alargue: horarios, canchas, resultados, posiciones y la llave de Copa de Oro y Copa de Plata.">
<meta name="theme-color" content="#09152b">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="El Alargue">
<meta property="og:title" content="Fixture — El Alargue">
<meta property="og:description" content="Horarios, canchas, resultados, posiciones y la llave del torneo de fútbol 5 El Alargue.">
<meta property="og:image" content="https://el-alargue.vercel.app/og-image.png">
<meta property="og:url" content="https://el-alargue.vercel.app/fixture.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://el-alargue.vercel.app/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --navy:#09152b; --bg:#09152b; --bg-2:#0b1a33; --surface:#11203c; --surface-2:#16284a;
  --ink:#f4f7fc; --muted:#a6b1c8; --faint:#97a3bd;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.26); --white:#fff; --focus:#9fc3ff;
  /* vivid zone + cup colors */
  --zA:#35a7f5; --zB:#2fd08a; --zC:#ffa33f; --zD:#ff5f8d;
  --oro:#f3c550; --plata:#aebfdd;
  --live:#ff4d4d; --win:#36d88f;
  --font-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"Inter",system-ui,sans-serif;
  --font-mono:"Space Mono",ui-monospace,monospace;
  --maxw:1100px; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{background:var(--bg)}
body{font-family:var(--font-body); color:var(--ink); line-height:1.55; margin:0; -webkit-font-smoothing:antialiased; overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:3px}
.wrap{max-width:var(--maxw); margin-inline:auto; padding-inline:max(18px,env(safe-area-inset-left,0px))}
.mono{font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.12em}

/* header */
header{position:sticky; top:0; z-index:50; background:var(--bg); border-bottom:1px solid var(--line)}
.bar{display:flex; align-items:center; gap:14px; height:60px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none}
.brand img{height:30px; width:auto; display:block}
.brand .wm{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.07em; font-size:1.18rem}
.bar .spacer{flex:1}
.nav{display:flex; gap:2px}
.nav a{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.04em;
  font-size:.9rem; text-decoration:none; color:var(--muted); padding:.5em .7em}
.nav a.on{color:var(--ink); box-shadow:inset 0 -2px 0 var(--zA)}
.nav a:hover{color:var(--ink)}

/* hero */
.hero{border-bottom:1px solid var(--line); background:
  radial-gradient(120% 140% at 0% 0%, rgba(53,167,245,.10), transparent 45%),
  radial-gradient(120% 140% at 100% 0%, rgba(255,95,141,.10), transparent 45%), var(--bg-2)}
.hero .wrap{padding-block:26px 22px}
.hero .eyebrow{font-family:var(--font-mono); font-size:.72rem; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
.hero h1{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:clamp(2.2rem,7vw,3.4rem); line-height:.95; margin:8px 0 0}
.hero h1 b{color:var(--zA)}
.note{display:flex; gap:10px; align-items:flex-start; margin-top:16px; border:1px solid color-mix(in srgb,var(--oro) 40%,var(--line));
  border-left:3px solid var(--oro); padding:11px 14px; background:color-mix(in srgb,var(--oro) 7%,var(--surface)); max-width:72ch; border-radius:8px}
.note svg{flex:0 0 auto; width:18px; height:18px; color:var(--oro); margin-top:2px}
.note p{margin:0; color:var(--muted); font-size:.9rem}

/* controls */
.controls{display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding-block:22px 4px; position:sticky; top:60px; z-index:30;
  background:linear-gradient(var(--bg) 70%, transparent)}
.seg{display:inline-flex; border:1px solid var(--line-2); background:var(--bg-2); border-radius:9px; overflow:hidden}
.seg button{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.03em;
  font-size:.9rem; color:var(--muted); background:transparent; border:0; padding:.55em 1em; cursor:pointer; transition:.15s}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--white); color:var(--navy)}
.seg button:not(.on):hover{color:var(--ink); background:rgba(255,255,255,.05)}
.seg.small button{font-size:.8rem; padding:.5em .85em}
.controls .sp{flex:1}
.upd{font-family:var(--font-mono); font-size:.66rem; letter-spacing:.08em; color:var(--faint); text-transform:uppercase}

main{padding:8px 0 64px}

/* group headers */
.timehead{display:flex; align-items:center; gap:12px; margin:24px 0 12px}
.timehead .t{font-family:var(--font-display); font-weight:700; font-size:1.5rem; line-height:1}
.timehead .t small{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.14em; color:var(--faint); margin-left:6px; text-transform:uppercase}
.timehead::after{content:""; flex:1; height:1px; background:var(--line)}
.zonehead{display:flex; align-items:center; gap:12px; margin:26px 0 14px}
.zonehead .bar2{width:5px; height:26px; border-radius:3px; background:var(--zc)}
.zonehead h2{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.7rem; line-height:1}
.zonehead .tag{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--zc); border:1px solid color-mix(in srgb,var(--zc) 50%,transparent); padding:3px 8px; border-radius:20px}
.zonehead::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,color-mix(in srgb,var(--zc) 40%,transparent),var(--line))}

/* match grid + cards */
.mgrid{display:grid; gap:12px; grid-template-columns:1fr}
@media(min-width:620px){ .mgrid{grid-template-columns:1fr 1fr} }
@media(min-width:920px){ .mgrid{grid-template-columns:1fr 1fr 1fr} }
.mcard{position:relative; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--zc);
  border-radius:12px; padding:13px 15px; transition:transform .16s ease, border-color .16s, box-shadow .16s;
  animation:cardIn .4s cubic-bezier(.2,.7,.2,1) backwards; animation-delay:var(--d,0ms)}
.mcard:hover{transform:translateY(-3px); border-color:color-mix(in srgb,var(--zc) 55%,var(--line));
  box-shadow:0 12px 26px -16px var(--zc)}
.mtop{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.pill{font-family:var(--font-mono); font-size:.64rem; letter-spacing:.06em; text-transform:uppercase;
  padding:4px 8px; border-radius:6px; white-space:nowrap}
.pill.time{background:var(--bg-2); color:var(--ink); border:1px solid var(--line)}
.chip.zone{font-family:var(--font-mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--zc); background:color-mix(in srgb,var(--zc) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--zc) 40%,transparent); padding:3px 8px; border-radius:20px; white-space:nowrap}
.mtop .sp{flex:1}
.status{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; padding:3px 8px; border-radius:20px}
.status.prog{color:var(--faint); border:1px solid var(--line)}
.status.final{color:var(--win); border:1px solid color-mix(in srgb,var(--win) 45%,transparent); background:color-mix(in srgb,var(--win) 12%,transparent)}
.status.live{color:#fff; background:var(--live); display:inline-flex; align-items:center; gap:5px}
.status.live::before{content:""; width:7px; height:7px; border-radius:50%; background:#fff; animation:pulse 1.1s infinite}
.mbody{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px}
.team{font-family:var(--font-display); font-weight:600; text-transform:uppercase; letter-spacing:.01em; font-size:1.16rem; line-height:1.05; min-width:0; overflow-wrap:anywhere}
.team.home{text-align:right}
.team.away{text-align:left}
.team.ph{color:var(--muted); font-weight:500}
.score{min-width:58px; text-align:center; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:7px 6px;
  font-family:var(--font-display); font-weight:700; font-size:1.5rem; line-height:1; font-variant-numeric:tabular-nums}
.score i{color:var(--faint); font-style:normal; margin:0 1px}
.score.vs{font-family:var(--font-mono); font-size:.72rem; font-weight:400; letter-spacing:.08em; color:var(--faint); padding:9px 8px}
.score .w{color:var(--zc)}
.score .pen{display:block; font-family:var(--font-mono); font-weight:400; font-size:.54rem; color:var(--faint); letter-spacing:.04em; margin-top:4px}

/* standings */
.zonas-grid{display:grid; gap:16px; grid-template-columns:1fr}
@media(min-width:760px){ .zonas-grid{grid-template-columns:1fr 1fr} }
.ztable{border:1px solid var(--line); border-radius:12px; overflow:hidden; border-top:3px solid var(--zc);
  animation:cardIn .4s ease backwards; animation-delay:var(--d,0ms)}
.ztable .zh{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.25rem;
  padding:11px 14px; border-bottom:1px solid var(--line); background:color-mix(in srgb,var(--zc) 12%,var(--bg-2)); display:flex; justify-content:space-between; align-items:center}
.ztable .zh .zt{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.12em; color:var(--zc)}
table{width:100%; border-collapse:collapse; font-size:.9rem}
th,td{padding:9px 5px; text-align:center; font-variant-numeric:tabular-nums}
th{font-family:var(--font-mono); font-size:.58rem; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); font-weight:400; border-bottom:1px solid var(--line)}
td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
.team-cell{text-align:left; font-family:var(--font-display); font-weight:600; text-transform:uppercase; font-size:1rem; white-space:nowrap}
.pos{color:var(--faint); font-family:var(--font-mono); font-size:.72rem; width:26px}
tr.q .pos{color:var(--zc); font-weight:700}
tr.q{background:color-mix(in srgb,var(--zc) 7%,transparent)}
tr.q .team-cell{border-left:3px solid var(--zc)}
td.pts{font-family:var(--font-display); font-weight:700; font-size:1.1rem}
.legend{display:flex; flex-wrap:wrap; gap:16px; margin-top:16px; font-family:var(--font-mono); font-size:.64rem; letter-spacing:.05em; color:var(--faint); text-transform:uppercase}
.legend b{display:inline-flex; align-items:center; gap:6px; font-weight:400}
.legend .sw{width:9px; height:9px; border-radius:2px; display:inline-block}

/* bracket */
.cups{display:grid; gap:20px; grid-template-columns:1fr}
@media(min-width:880px){ .cups{grid-template-columns:1fr 1fr} }
.cup{border:1px solid var(--line); border-radius:14px; overflow:hidden; border-top:3px solid var(--zc);
  animation:cardIn .4s ease backwards}
.cup.oro{--zc:var(--oro)} .cup.plata{--zc:var(--plata)}
.cup .ch{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.6rem; letter-spacing:.02em;
  padding:14px 16px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:11px;
  background:color-mix(in srgb,var(--zc) 13%,var(--bg-2)); color:var(--zc)}
.cup .ch .trophy{width:20px; height:20px}
.round{padding:12px 16px}
.round + .round{border-top:1px solid var(--line)}
.round .rl{font-family:var(--font-mono); font-size:.62rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); margin-bottom:10px}
.tie{display:grid; grid-template-columns:76px 1fr; gap:12px; padding:9px 0; align-items:center}
.tie + .tie{border-top:1px dashed var(--line)}
.tie .slot{font-family:var(--font-mono); font-size:.66rem; color:var(--muted); line-height:1.35}
.tie .slot .c{display:block; color:var(--faint); font-size:.58rem}
.tie .pair{display:flex; flex-direction:column; gap:4px; border-left:3px solid color-mix(in srgb,var(--zc) 45%,transparent); padding-left:10px}
.tie .pair span{font-family:var(--font-display); font-weight:600; text-transform:uppercase; color:var(--muted); font-size:1.02rem}
.tie .pair span b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}

/* tabs scroll on small screens */
#tabs{max-width:100%; overflow-x:auto; overflow-y:hidden; scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}

/* ranking tables (goleadores / tarjetas / fair play) */
.rank{border:1px solid var(--line); border-radius:12px; overflow:hidden; animation:cardIn .4s ease backwards}
.rank.gol{border-top:3px solid var(--oro)}
.rank + .rank{margin-top:18px}
.rank .rh{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.2rem;
  padding:12px 15px; border-bottom:1px solid var(--line); background:var(--bg-2); display:flex; align-items:center; gap:9px}
.rank .rh svg{width:18px; height:18px; color:var(--oro)}
.rank table th.l, .rank table td.l{text-align:left}
.rank .nm{font-family:var(--font-display); font-weight:600; text-transform:uppercase; font-size:1rem}
.rank .eq{color:var(--muted); font-family:var(--font-body); text-transform:none; font-weight:500; font-size:.9rem}
.rank td.g{font-family:var(--font-display); font-weight:700; font-size:1.25rem; color:var(--oro)}
.rank tr.top td.g{font-size:1.5rem}
.rank tr.top .pos{color:var(--oro); font-weight:700}
.rank tr.top{background:color-mix(in srgb,var(--oro) 8%,transparent)}
.cc{font-variant-numeric:tabular-nums; margin-right:6px; font-weight:600}
.card-ico{display:inline-block; width:12px; height:16px; border-radius:2px; vertical-align:-3px; box-shadow:0 1px 2px rgba(0,0,0,.3)}
.yc{background:var(--oro)} .rc{background:var(--live)}
.fp-note{font-family:var(--font-mono); font-size:.6rem; letter-spacing:.04em; color:var(--faint); text-transform:uppercase; padding:10px 15px; margin:0; border-top:1px solid var(--line)}
.empty{border:1px dashed var(--line-2); border-radius:14px; padding:46px 20px; text-align:center; color:var(--muted); margin-top:6px}
.empty svg{width:36px; height:36px; color:var(--faint); margin-bottom:12px}
.empty h3{font-family:var(--font-display); font-weight:700; text-transform:uppercase; font-size:1.3rem; color:var(--ink); margin:0 0 6px}
.empty p{margin:0; font-size:.92rem; max-width:40ch; margin-inline:auto}

.tabs-wrap{position:relative; min-width:0; max-width:100%}
.tabs-wrap::after{content:""; position:absolute; top:0; right:0; bottom:0; width:30px; pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--bg-2)); opacity:0; transition:opacity .2s}
.tabs-wrap.more::after{opacity:1}
.livehead{display:flex; align-items:center; gap:9px; margin:22px 0 12px; font-family:var(--font-display);
  font-weight:700; text-transform:uppercase; font-size:1.3rem; color:var(--live)}
.livedot{width:11px; height:11px; border-radius:50%; background:var(--live); animation:pulse 1.1s infinite}
.mcard.islive{border-color:var(--live); box-shadow:0 0 0 1px var(--live), 0 12px 26px -14px var(--live)}

footer{border-top:1px solid var(--line); background:var(--bg-2)}
footer .wrap{padding-block:26px; display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px}
footer img{height:26px}
footer .sp{flex:1}
footer .muted{font-family:var(--font-mono); font-size:.66rem; letter-spacing:.1em; color:var(--faint); text-transform:uppercase}
footer a.back{font-family:var(--font-display); font-weight:700; text-transform:uppercase; letter-spacing:.05em; text-decoration:none; color:var(--ink); font-size:.95rem}

@keyframes cardIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes pulse{0%{transform:scale(1); opacity:1}70%{transform:scale(1.6); opacity:.2}100%{transform:scale(1); opacity:1}}
@keyframes paneIn{from{opacity:0} to{opacity:1}}
.pane{animation:paneIn .25s ease}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *{animation:none!important}
  .mcard, .ztable, .cup{opacity:1!important; transform:none!important}
  .mcard:hover{transform:none}
}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <a class="brand" href="index.html"><img src="el-alargue-logo.png" alt="El Alargue"><span class="wm">El Alargue</span></a>
    <span class="spacer"></span>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="fixture.html" class="on" aria-current="page">Fixture</a>
      <a href="index.html#inscripcion">Inscripción</a>
    </nav>
  </div>
</header>

<div class="hero">
  <div class="wrap">
    <div class="eyebrow">Torneo de Fútbol 5 · Temporada 2026</div>
    <h1>Fixture &amp; <b>Resultados</b></h1>
    <div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16" x2="12" y2="16"/></svg>
      <p id="nota"></p>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="controls">
    <div class="tabs-wrap"><div class="seg" id="tabs" role="tablist">
      <button data-tab="partidos" class="on">Partidos</button>
      <button data-tab="posiciones">Posiciones</button>
      <button data-tab="llave">Llave</button>
      <button data-tab="goleadores">Goleadores</button>
      <button data-tab="tarjetas">Tarjetas</button>
    </div></div>
    <div class="seg" id="days"></div>
    <div class="seg small" id="view">
      <button data-view="horario" class="on">Por horario</button>
      <button data-view="zona">Por zona</button>
    </div>
    <span class="sp"></span>
    <span class="upd" id="upd"></span>
  </div>
</div>

<main class="wrap">
  <div id="pane-partidos" class="pane"></div>
  <div id="pane-posiciones" class="pane" hidden></div>
  <div id="pane-llave" class="pane" hidden></div>
  <div id="pane-goleadores" class="pane" hidden></div>
  <div id="pane-tarjetas" class="pane" hidden></div>
</main>

<footer>
  <div class="wrap">
    <img src="el-alargue-logo.png" alt="El Alargue">
    <a class="back" href="index.html">← Volver al inicio</a>
    <span class="sp"></span>
    <span class="muted">El Alargue · Fútbol 5</span>
  </div>

    var rows=GOL.slice().sort(function(a,b){return b.goles-a.goles||(a.jugador<b.jugador?-1:1);});
    var h='<div class="rank gol"><div class="rh">'+ICON_BALL.replace('width="1.5"','width="1.6"')+'Tabla de goleadores</div><table><thead><tr><th class="pos"></th><th class="l">Jugador</th><th class="l">Equipo</th><th>Goles</th></tr></thead><tbody>';
    rows.forEach(function(r,i){ h+='<tr class="'+(i===0?'top':'')+'"><td class="pos">'+(i+1)+'</td><td class="l nm">'+esc(r.jugador)+'</td><td class="l eq">'+esc(name(r.equipo))+'</td><td class="g">'+r.goles+'</td></tr>'; });
    h+='</tbody></table></div>';
    el.innerHTML=h;
  }
  function renderTarjetas(){
    var el=document.getElementById('pane-tarjetas');
    if(!TAR.length){ el.innerHTML=emptyState(ICON_CARD,'Sin tarjetas','Las amarillas y rojas se cargan a medida que se juega. Acá vas a ver quién está amonestado.'); return; }
    var rows=TAR.slice().sort(function(a,b){return ((b.rojas||0)-(a.rojas||0))||((b.amarillas||0)-(a.amarillas||0))||(a.jugador<b.jugador?-1:1);});
    var h='<div class="rank"><div class="rh">Tarjetas por jugador</div><table><thead><tr><th class="l">Jugador</th><th class="l">Equipo</th><th>Amar.</th><th>Rojas</th></tr></thead><tbody>';
    rows.forEach(function(r){ h+='<tr><td class="l nm">'+esc(r.jugador)+'</td><td class="l eq">'+esc(name(r.equipo))+'</td><td><span class="cc">'+(r.amarillas||0)+'</span><span class="card-ico yc"></span></td><td><span class="cc">'+(r.rojas||0)+'</span><span class="card-ico rc"></span></td></tr>'; });
    h+='</tbody></table></div>';
    el.innerHTML=h;
  }

  function render(){
    ['partidos','posiciones','llave','goleadores','tarjetas'].forEach(function(t){
      var el=document.getElementById('pane-'+t); el.hidden=(state.tab!==t);
    });
    var pane=document.getElementById('pane-'+state.tab);
    if(state.tab==='partidos') renderPartidos();
    else if(state.tab==='posiciones') renderPosiciones();
    else if(state.tab==='llave') renderLlave();
    else if(state.tab==='goleadores') renderGoleadores();
    else renderTarjetas();
    pane.style.animation='none'; void pane.offsetWidth; pane.style.animation='';
  }
  document.querySelectorAll('#tabs button').forEach(function(b){ b.setAttribute('role','tab'); b.id='tab-'+b.dataset.tab; b.setAttribute('aria-controls','pane-'+b.dataset.tab); });
  ['partidos','posiciones','llave','goleadores','tarjetas'].forEach(function(t){ var p=document.getElementById('pane-'+t); if(p){ p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+t); } });
  var tabsEl=document.getElementById('tabs'), tw=tabsEl.parentElement;
  function tabHint(){ if(tw) tw.classList.toggle('more', (tabsEl.scrollWidth - tabsEl.clientWidth - tabsEl.scrollLeft) > 4); }
  tabsEl.addEventListener('scroll', tabHint, {passive:true}); addEventListener('resize', tabHint);
  tabHint(); setTimeout(tabHint, 400);
  sync(); render();
})();
</script>
</body>
</html>
